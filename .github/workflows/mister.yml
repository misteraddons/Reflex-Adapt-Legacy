name: MiSTer Wrapper

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mister.yml
      - mister/**
  push:
    branches: [legacy_v1]
    paths:
      - .github/workflows/mister.yml
      - mister/**

concurrency:
  group: mister-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mister
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: mister/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Scan dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Cross-compile MiSTer wrapper
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
        run: go build -trimpath -ldflags="-s -w" -o /tmp/reflex_updater.sh .
